org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# NoteFlow configuration (override in ~/.gradle/gradle.properties or CI env).
# BACKEND_URL must point at the secure AI backend (see /server.ts in repo root).
# The Android emulator reaches the host machine via 10.0.2.2.
# ---------------------------------------------------------------------------
noteflow.backendUrl=http://10.0.2.2:3000/
noteflow.supabaseUrl=
noteflow.supabaseAnonKey=
noteflow.googleWebClientId=
